<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Extension test harness (DOM mock)</title>
</head>
<body>
  <!-- Mimics a YouTube watch page: transcript toggle button + live chat frame -->
  <button id="mock-tx-btn" aria-label="Show transcript">Show transcript</button>
  <ytd-engagement-panel-section-list-renderer
     target-id="engagement-panel-searchable-transcript"
     hidden>TRANSCRIPT PANEL</ytd-engagement-panel-section-list-renderer>
  <!-- NEW two-surface layout (2026-08-28): inline description-section transcript,
       independent of the slide-out engagement panel above. -->
  <ytd-video-description-transcript-section-renderer id="mock-inline-sec">
    <button id="mock-inline-btn" aria-label="Show transcript">Show transcript</button>
    <ytd-transcript-renderer id="mock-inline-body" hidden>INLINE TRANSCRIPT BODY</ytd-transcript-renderer>
  </ytd-video-description-transcript-section-renderer>
  <ytd-live-chat-frame id="chat">LIVE CHAT FRAME</ytd-live-chat-frame>
  <!-- The player, so the readiness gate (auto-open only when the player has
       mounted its video element) has something to see. -->
  <div id="movie_player"><video></video></div>

  <script>
    // ── Make the mock behave like YouTube: clicking the toggle reveals/hides
    //    the panel AND flips its own aria-label. The extension trusts this
    //    label as the authoritative open/closed signal. ─────────────────────
    document.getElementById("mock-tx-btn").addEventListener("click", function () {
      const panel = document.querySelector('ytd-engagement-panel-section-list-renderer');
      const open = this.getAttribute("aria-label").toLowerCase().includes("show");
      if (open) {
        panel.removeAttribute("hidden");
        this.setAttribute("aria-label", "Hide transcript");
        this.textContent = "Hide transcript";
      } else {
        panel.setAttribute("hidden", "");
        this.setAttribute("aria-label", "Show transcript");
        this.textContent = "Show transcript";
      }
    });
    // The INLINE surface is an independent toggle: clicking its button flips
    // the inline body only — the engagement panel is NOT affected. This is
    // what a two-surface YouTube layout actually does.
    document.getElementById("mock-inline-btn").addEventListener("click", function () {
      const body = document.getElementById("mock-inline-body");
      const open = this.getAttribute("aria-label").toLowerCase().includes("show");
      if (open) {
        body.removeAttribute("hidden");
        this.setAttribute("aria-label", "Hide transcript");
        this.textContent = "Hide transcript";
      } else {
        body.setAttribute("hidden", "");
        this.setAttribute("aria-label", "Show transcript");
        this.textContent = "Show transcript";
      }
    });
  </script>

  <script>
    // ── Stub the chrome extension API ──────────────────────────────────────
    window.chrome = {
      storage: {
        sync: {
          _store: { openTranscript: true, closeLiveChat: true },
          _listeners: [],
          get(defaults, cb) { cb(Object.assign({}, defaults, this._store)); },
          set(patch, cb) {
            Object.assign(this._store, patch);
            const changes = {};
            for (const k in patch) changes[k] = { newValue: patch[k] };
            this._listeners.forEach(fn => fn(changes, "sync"));
            if (cb) cb();
          }
        },
        onChanged: {
          addListener(fn) { chrome.storage.sync._listeners.push(fn); }
        }
      }
    };
    // Session storage is real in the page.
  </script>

  <!-- Load the extension content script -->
  <script src="../content.js"></script>

  <script>
    // ── Test probes (exposed for the CDP driver) ──────────────────────────
    window.__probe = function () {
      const panel = document.querySelector('ytd-engagement-panel-section-list-renderer');
      const chat = document.querySelector('ytd-live-chat-frame');
      const floatBtn = document.querySelector('#tf-open-chat');
      const closeTxBtn = document.querySelector('#tf-close-tx');
      const inlineBody = document.getElementById('mock-inline-body');
      const inlineBtn = document.getElementById('mock-inline-btn');
      return {
        transcriptHidden: panel ? panel.hasAttribute('hidden') : null,
        transcriptDisplay: panel ? getComputedStyle(panel).display : null,
        inlineHidden: inlineBody ? inlineBody.hasAttribute('hidden') : null,
        inlineDisplay: inlineBody ? getComputedStyle(inlineBody).display : null,
        inlineBtnLabel: inlineBtn ? inlineBtn.getAttribute('aria-label') : null,
        chatDisplay: chat ? getComputedStyle(chat).display : null,
        floatMounted: !!floatBtn,
        floatBtnText: floatBtn ? floatBtn.textContent : null,
        closeTxMounted: !!closeTxBtn,
        closeTxText: closeTxBtn ? closeTxBtn.textContent : null,
        sessionChat: sessionStorage.getItem("tfg.liveChatUnlocked"),
        sessionTx: sessionStorage.getItem("tfg.transcriptClosed"),
      };
    };
    // Simulate clicking the "re-enable live chat" float button.
    window.__clickReenable = function () {
      document.querySelector('#tf-open-chat').click();
    };
    window.__clickCloseTx = function () {
      document.querySelector('#tf-close-tx').click();
    };
    // Two-surface repro: open the INLINE transcript only (the way the real
    // YouTube layout does), then let the extension's close path try to close.
    window.__openInlineOnly = function () {
      document.getElementById('mock-inline-btn').click();
    };
    window.__openPanelOnly = function () {
      document.getElementById('mock-tx-btn').click();
    };
  </script>
</body>
</html>
